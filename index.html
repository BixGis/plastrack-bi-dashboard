<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlasTrack BI Dashboard</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <header>
        <h1>PlasTrack</h1>
        <p>Plataforma de monitoreo y análisis de pasadas satelitales en Galápagos</p>
        <div id="status">Estado: <span>Online</span></div>
        <div id="last-update">Última actualización: <span id="update-date">-</span></div>
        <div class="badge">DATOS SIMULADOS</div>
    </header>
    <main>
        <section id="kpis" class="cards"></section>
        <div class="filter-bar">
            <select id="filter-island"><option value="all">Todas las islas</option></select>
            <select id="filter-satellite"><option value="all">Todos los satélites</option></select>
            <select id="filter-cloud"><option value="all">Todas las nubosidades</option><option value="0-20">0‑20%</option><option value="21-50">21‑50%</option><option value="51-100">51‑100%</option></select>
            <button id="reset-filters">Restablecer</button>
        </div>
        <section id="map" class="map-container"></section>
        <section id="charts" class="charts-container"></section>
    </main>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
